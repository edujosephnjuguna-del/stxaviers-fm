const XP=s=>new DOMParser().parseFromString(s,'application/xml');
const colIdx=r=>{let n=0;for(const ch of r.replace(/\d/g,''))n=n*26+ch.charCodeAt(0)-64;return n-1};
async function unzip(buf){
 const dv=new DataView(buf),u8=new Uint8Array(buf);let e=u8.length-22;
 while(e>=0&&dv.getUint32(e,true)!==0x06054b50)e--;if(e<0)throw new Error('zip');
 const n=dv.getUint16(e+10,true);let p=dv.getUint32(e+16,true);const F={};
 for(let i=0;i<n;i++){const nl=dv.getUint16(p+28,true),el=dv.getUint16(p+30,true),cl=dv.getUint16(p+32,true);
  F[new TextDecoder().decode(u8.subarray(p+46,p+46+nl))]={m:dv.getUint16(p+10,true),c:dv.getUint32(p+20,true),o:dv.getUint32(p+42,true)};p+=46+nl+el+cl}
 return{has:k=>!!F[k],async read(k){const f=F[k];if(!f)return null;const s=f.o+30+dv.getUint16(f.o+26,true)+dv.getUint16(f.o+28,true),d=u8.subarray(s,s+f.c);
  if(f.m===0)return new TextDecoder().decode(d);
  return await new Response(new Blob([d]).stream().pipeThrough(new DecompressionStream('deflate-raw'))).text()}}
}
async function readXlsx(z){
 const ss=[],sx=await z.read('xl/sharedStrings.xml');
 if(sx)XP(sx).querySelectorAll('si').forEach(si=>ss.push([...si.querySelectorAll('t')].filter(t=>t.parentNode.nodeName!=='rPh').map(t=>t.textContent).join('')));
 const wb=XP(await z.read('xl/workbook.xml')),rel=XP(await z.read('xl/_rels/workbook.xml.rels')),tg={};
 rel.querySelectorAll('Relationship').forEach(r=>tg[r.getAttribute('Id')]=r.getAttribute('Target'));
 const out=[];
 for(const s of wb.querySelectorAll('sheet')){
  let t=tg[s.getAttribute('r:id')]||'';t=t.startsWith('/')?t.slice(1):'xl/'+t;
  const xml=await z.read(t);if(!xml)continue;const rows=[];
  XP(xml).querySelectorAll('sheetData > row').forEach(row=>{
   const ri=(+row.getAttribute('r')||rows.length+1)-1,arr=rows[ri]=rows[ri]||[];
   row.querySelectorAll(':scope > c').forEach(c=>{const ci=colIdx(c.getAttribute('r')),ty=c.getAttribute('t'),v=c.querySelector('v')?.textContent;let val;
    if(ty==='s')val=ss[+v];else if(ty==='inlineStr')val=[...c.querySelectorAll('t')].map(x=>x.textContent).join('');else if(ty==='str'||ty==='e')val=v;else if(ty==='b')val=v==='1';else if(v!=null&&v!=='')val=parseFloat(v);
    if(val!==undefined)arr[ci]=val})});
  out.push({name:s.getAttribute('name'),rows:Array.from(rows,r=>r||[])});
 }
 return out;
}
async function readOds(z){
 const d=XP(await z.read('content.xml')),out=[];
 for(const tb of d.getElementsByTagName('table:table')){const rows=[];
  for(const tr of tb.getElementsByTagName('table:table-row')){const rep=Math.min(+tr.getAttribute('table:number-rows-repeated')||1,50),row=[];let ci=0;
   for(const c of tr.children){if(!/table-cell$/.test(c.nodeName))continue;const cr=+c.getAttribute('table:number-columns-repeated')||1;
    const vt=c.getAttribute('office:value-type'),v=c.getAttribute('office:value');
    const val=vt==='float'||vt==='currency'||vt==='percentage'?parseFloat(v):vt?(c.getAttribute('office:string-value')||[...c.getElementsByTagName('text:p')].map(p=>p.textContent).join('\n')):undefined;
    if(val===undefined||val===''){ci+=Math.min(cr,50);continue}
    for(let k=0;k<Math.min(cr,50);k++)row[ci++]=val}
   const has=row.some(x=>x!==undefined);for(let k=0;k<(has?rep:1);k++)rows.push(row.slice())}
  out.push({name:tb.getAttribute('table:name'),rows})}

 secs.forEach(sec=>{const h=sec.querySelector('h2');if(!h)return;let head=h;while(head.parentElement&&head.parentElement!==sec)head=head.parentElement;if(head.parentElement!==sec)return;

  const k=foldKey(sec,h);head.classList.add('phead');sec.dataset.fk=k;
  const b=document.createElement('button');b.className='cbtn';b.dataset.act='fold';b.dataset.k=k;b.setAttribute('aria-label','Fold or open this section');h.prepend(b);h.classList.add('fh');h.dataset.act='fold';h.dataset.k=k;
  const shut=!!FOLD[k];sec.classList.toggle('shut',shut);b.setAttribute('aria-expanded',String(!shut));b.textContent=shut?'▸':'▾';n.push(sec)});
 if(n.length>1){const bar=document.createElement('div');bar.className='np foldbar';bar.innerHTML=`<button class="sm ghost" data-act="foldall">Collapse all</button><button class="sm ghost" data-act="unfoldall">Expand all</button>`;$('#app').prepend(bar)}}

function yeData(){
 const Y=S.yeY||String(new Date().getFullYear());S.yeY=Y;const cfg=db.ye[Y]||{};
 const from=cfg.from||`${Y}-01-01`,to=cfg.to||`${Y}-12-31`,inR=l=>(l.date||'')>=from&&(l.date||'')<=to;
 const P=[];db.teachers.forEach(t=>{const m=memOfT(t),sv=savingsOf(t);if(t.active!==false||m||sv.bal)P.push({id:'t:'+t.id,name:t.name,t,m,sv})});
 db.members.filter(m=>!m.tid||!tById(m.tid)).forEach(m=>P.push({id:'m:'+m.id,name:m.name,m}));
 const used=new Set();
 P.forEach(p=>{p.loans=db.loans.filter(l=>(p.m&&l.mid===p.m.id)||(p.t&&l.tid===p.t.id));p.loans.forEach(l=>used.add(l.id));
  p.shares=p.m?.shares||0;p.int=sum(p.loans.filter(inR),l=>l.interest+chOf(l));p.lb=sum(p.loans,l=>Math.max(0,bal(l)));
  p.unpDef=sum(p.loans.filter(l=>bal(l)>0),l=>Math.min(bal(l),l.interest+chOf(l)));p.unp=cfg.unpaid?.[p.id]??p.unpDef;p.trip=p.sv?.bal||0;
  p.sc=p.m?(cfg.shares?.[p.id]??p.shares):0;p.adj=num(cfg.adj?.[p.id])});
 const others=sum(db.loans.filter(l=>!used.has(l.id)&&inR(l)),l=>l.interest+chOf(l)),grossCalc=sum(P,p=>p.int)+others,gross=cfg.gross??grossCalc;
 const cost=cfg.cost??db.set.costOps,net=gross-cost,shares=sum(P,p=>p.sc),raw=shares?net/shares:0,dps=cfg.dps??floorTo(raw,db.set.dpsRound);
 P.forEach(p=>{p.divBase=p.sc*dps;p.div=p.sc?p.divBase-p.unp+p.adj:p.adj;p.pay=p.trip+p.div-p.lb});
 return{Y,from,to,cfg,P,others,gross,grossCalc,cost,net,shares,raw,dps,totDiv:sum(P,p=>p.divBase)}}

 <section class="panel"><h3>Import this sheet as</h3><div class="row">${periodPick('i',F.per)}</div>

 <p class="hint">Motivation schedule: needs a Name column; reads AMOUNT, C.T, Trip, Welfare, SACCO, extra-hours (Ext. Cnt, 5-6 extra H) and notes into the chosen term and month, then checks each Net against the file. Extra-hours lessons: needs Teachers and No. of Lessons columns, and adds the lessons to the chosen schedule. SACCO members: needs a MEMBERS column (the HOME sheet). Loan register: the All Loans sheet layout (PERSON, LOAN, DATE ISS, DATE OF REP, L. REPAYMENT, INTEREST, L. BaL); penalties are taken from the balance column, and dates that Excel turned the wrong way round are corrected. Other fund sharing: a sheet like the Saturday account (amounts collected by grade, EXPENDITURE, then names and amounts). SACCO RECON sheet: a sheet like RECON 2026 (MEMBERS, trip P.M, Months saved, trip savings, INTEREST NOT PAID); each teacher’s trip savings become the balance brought forward to the month named in its title (for example “including Month 3 T3 2026”), and schedules up to that month are not counted again. The term, month and year pickers apply to the schedule, lessons and RECON imports.</p></section>`;

const MTYPES=[['pay','Payslip for a motivation schedule'],['stmt','Account summary (savings, loans, welfare, payable)'],['loan','Loan balance reminder'],['free','Your own message']];
function waNum(p){let d=String(p||'').replace(/\D/g,'');if(!d)return'';if(d.startsWith('0'))d='254'+d.slice(1);else if(d.length===9&&/^[17]/.test(d))d='254'+d;return d}

function takeHome(t,k){const p=yeData().P.find(x=>x.t===t),trip=savingsOf(t).bal,lb0=p?p.lb:tLoanBal(t),div=p?.div||0;let co=0,net=null,paidLine=false;
 if(k){const r=db.runs[k];if(r&&r.tids.includes(t.id)){const w=wget(r,t),c=calc(r,t,w);net=c.net;paidLine=!!w.paid;if(!w.paid)co=Math.max(0,sum(incl(r).filter(i=>i.mode==='loan'),i=>c.vals[i.id]||0)-preCo(t,k))}}
 const lb=Math.max(0,lb0-co),total=(net||0)+trip+div-lb;return{trip,lb0,co,lb,div,net,k,paidLine,total,pay:trip+div-lb}}
function takeHomeText(t,k,label){const h=takeHome(t,k);if(!h.trip&&!h.lb&&!h.div)return[];const o=['','*What you will receive*'];
 if(h.net!==null)o.push(L(label||'Net pay this month (loan check-off already taken off)',h.net));
 o.push(L('Add trip savings',h.trip));if(h.div)o.push(L('Add dividends',h.div));
 o.push(h.lb?L('Less loan balance still remaining',h.lb):'Loan balance remaining: none');
 o.push(h.total>=0?`*Total you will receive: KES ${fmt(h.total)}*`:`*Still owed after ${h.net!==null?'this motivation and ':''}your trip savings: KES ${fmt(-h.total)}*`);return o}
function msgPay(t,k){const r=db.runs[k];if(!r||!r.tids.includes(t.id))return null;const w=wget(r,t),c=calc(r,t,w),out=[`*${r.label}: motivation*`,`Dear ${t.name},`,''];
 incl(r).filter(i=>i.kind!=='ded').forEach(i=>{const v=c.vals[i.id];if(v)out.push(L(i.name+(i.mode==='lesson'?` (${num(w.v[i.id])} lessons)`:''),v))});
 out.push(L('Total earnings',c.earn));const ds=incl(r).filter(i=>i.kind==='ded'&&c.vals[i.id]);if(ds.length){out.push('Less:');ds.forEach(i=>out.push('  '+L(i.name,c.vals[i.id])))}
 out.push(`*Net pay: KES ${fmt(c.net)}*`);if(w.paid&&w.date&&!w.quiet)out.push(`Paid on ${dshow(w.date)}.`);if(w.note)out.push(`Note: ${w.note}`);

 const sv=savingsOf(t),lb=tLoanBal(t),m=memOfT(t),p=yeData().P.find(x=>x.t===t),out=[`*Account summary, ${dshow(today())}*`,`Dear ${t.name},`,''];
 out.push(L(`Motivation paid in ${Y} (${keys.length} month${keys.length===1?'':'s'})`,net));out.push(L(`Welfare contributed in ${Y}`,welOfT(t,Y)));{const s=satOfT(t,Y);if(s)out.push(L(`Saturday program pay in ${Y}`,s))}
 if(m)out.push(`SACCO shares: ${m.shares} (KES ${fmt(m.shares*db.set.share)})`);
 {const lk=runKeys().filter(k=>db.runs[k].tids.includes(t.id)).pop();out.push(...takeHomeText(t,lk,lk?`Net pay ${db.runs[lk].label}`:'').map(x=>x.startsWith('Add trip savings:')?L(`Add trip savings${sv.months?` (${sv.months} month${sv.months===1?'':'s'} saved)`:''}`,sv.bal):x))}return out.join('\n')+SIGN}

 {const co=coordOf(p,d);if(co){const o=by[co.tid]=by[co.tid]||{key:co.tid,name:tById(co.tid)?.name||'',n:0,amt:0,det:[]};o.amt+=co.amt;o.det.push('Coordinator')}}

 if(d.spx){const e=p.extra.find(x=>x.id===d.spx);e[d.f]=d.f==='n'?num(t.value):t.value.trim();save();render();return true}
 if(d.spg){const g=p.grades.find(x=>x.id===d.spg);g[d.f]=d.f==='g'?t.value.trim():t.value===''?'':num(t.value);save();render();return true}
 if(d.stt){const l=p.tt.find(x=>x.id===d.stt);l[d.f]=d.f==='n'?num(t.value):t.value.trim();save();render();return true}
 const day=d.d?p.days.find(y=>y.id===d.d):curDay(p);
 if(d.sd){const v=t.value.trim();if(d.sd==='coordAmt'){if(v==='')delete day.coordAmt;else day.coordAmt=num(v)}else if(d.sd==='coordTid'){if(v)day.coordTid=v;else delete day.coordTid}else day[d.sd]=v;if(d.sd==='date')renumber(p);save();render();return true}
 if(d.sdc){if(t.checked)day.noCoord=1;else delete day.noCoord;save();render();return true}
 if(d.lvr){const v=p.levels.find(x=>x.id===d.lvr);v[d.f]=d.f==='rate'?num(t.value):t.value.trim();save();render();return true}
 if(d.cls){const c=p.classes.find(x=>x.id===d.cls);if(d.f==='name'){const old=c.name,nw=t.value.trim();if(!nw)return render()||true;c.name=nw;(p.tt||[]).forEach(l=>{if(normC(l.cls)===normC(old))l.cls=nw})}else c[d.f]=t.value;save();render();return true}
 if(d.coord){if(d.coord==='tid'){p.coordTid=t.value||undefined;if(t.value&&!p.coordFrom)p.coordFrom=today()}else if(d.coord==='amt')p.coordAmt=num(t.value);else p.coordFrom=t.value;save();render();return true}
 if(d.sst){const y=p.days.find(z=>z.id===d.sst);if(t.value==='off'&&Object.keys(y.paid||{}).length){toast('Some teachers are paid for this Saturday; cancel those payments first.');return render()||true}y.status=t.value;if(t.value==='off'&&!y.note)y.note='No school';save();render();return true}
 if(d.sres){const y=p.days.find(z=>z.id===d.sres);y.note=t.value.trim();save();return true}
 if(d.sl){const l=day.lines.find(x=>x.id===d.sl);if(d.f==='amt'){if(t.value==='')delete l.amt;else l.amt=num(t.value)}else l[d.f]=d.f==='n'?num(t.value):t.value.trim();save();render();return true}
 if(d.sx){const x=day.xtra.find(y=>y.id===d.sx);x[d.f]=d.f==='amt'?num(t.value):t.value.trim();save();render();return true}
 if(d.spaid!==undefined){const z=dayPay(p,day).find(y=>y.key===d.spaid);if(!t.checked&&!confirm('Cancel this payment record?')){t.checked=true;return true}satPaid(p,day,z,t.checked);save();render();return true}
 if(t.id==='satwhat'){S.satWhat=t.value;render();return true}
 return false}

/* Excel often turns 5/6/2026 (5 June) into 6 May. Pick the reading that keeps a loan's dates in order and not in the future. */
function fixDates(evs){let lo='',fixed=0;const T=today();
 evs.forEach((e,i)=>{const c=e.cands;if(!c.length){e.date='';return}
  if(c.length===1){e.date=c[0];lo=c[0]>lo?c[0]:lo;return}
  const nx=evs.slice(i+1).find(x=>x.cands.length===1),hi=nx?nx.cands[0]:T,ok=x=>x>=lo&&x<=hi&&x<=T;
  e.date=c.find(ok)||c.find(x=>x>=lo&&x<=T)||c.find(x=>x<=T)||c[0];if(e.date!==c[0])fixed++;lo=e.date>lo?e.date:lo});

  if(h<0)continue;const f=re=>H.findIndex(x=>re.test(x)),fa=re=>H.map((x,i)=>re.test(x)?i:-1).filter(i=>i>=0);
  const cD=[f(/completion/),f(/value date|trans.*date|posting date|^date/),f(/date|time/)].find(i=>i>=0),cDesc=fa(/details|description|narration|particulars|other party|remarks|payee|account name/),cRef=f(/receipt|reference|ref\b|ref\.|transaction id|trans\.? id|code|cheque/),

const gsLabel=p=>`${p.name} — ${p.kind}`;
function fillFinder(){const dl=$('#gsl');if(!dl)return;const P=peopleAll().filter(p=>p.key[0]!=='n'||tabOK('lrn'));dl.innerHTML=P.map(p=>`<option value="${esc(gsLabel(p))}">`).join('')}

 if(!p)return toast('No one found with that name.');S.who=p.key;S.tab='who';render();scrollTo(0,0)}
function payDiff(t){const ks=runKeys().filter(k=>db.runs[k].tids.includes(t.id)).slice(-2);if(ks.length<2)return'';
 const [a,b]=ks.map(k=>{const r=db.runs[k],w=wget(r,t),c=calc(r,t,w);return{k,r,c}}),items=db.items.filter(i=>(a.c.vals[i.id]||0)!==(b.c.vals[i.id]||0));
 if(b.c.net===a.c.net&&!items.length)return`<p class="hint">Net pay is the same as last month (${fmt(b.c.net)}).</p>`;
 return`<div class="note" style="padding:8px 12px;border-radius:6px"><b>Why ${esc(b.r.label)} differs from ${esc(a.r.label)}:</b> net ${fmt(a.c.net)} → <b>${fmt(b.c.net)}</b> (${b.c.net>=a.c.net?'+':''}${fmt(b.c.net-a.c.net)})<ul style="margin:4px 0 0 18px;padding:0">${items.map(i=>{const x=a.c.vals[i.id]||0,y=b.c.vals[i.id]||0;return`<li>${esc(i.name)}${i.kind==='ded'?' (deduction)':''}: ${fmt(x)} → ${fmt(y)}</li>`}).join('')}</ul></div>`}
function vWho(){const key=S.who,p=key&&personKey(key);if(!p)return`<section class="panel"><h2>Find a person</h2><p class="hint">Type a name in the “Find a person” box at the top.</p></section>`;
 const o=p.o,k=p.kind,sec=[],ph=o.phone||'';
 sec.push(`<section class="panel"><div class="row" style="justify-content:space-between;align-items:flex-start"><div><h2 style="margin:0">${esc(o.name)}</h2><p class="hint" style="margin:4px 0 0">${esc((peopleAll().find(x=>x.key===key)||{}).kind||'')}${ph?' · '+esc(ph):''}${k==='t'&&o.tsc?' · TSC '+esc(o.tsc):''}${k==='t'&&desigText(o)?' · '+esc(desigText(o)):''}</p></div>
 <div class="row np">${k==='t'&&tabOK('rep')?`<button class="sm ghost" data-act="stmt" data-t="${o.id}">Full statement</button>`:''}${k==='t'&&tabOK('tea')?`<button class="sm ghost" data-act="tdet" data-t="${o.id}">Details</button>`:''}${printBtn()}</div></div></section>`);
 if(k==='t'&&tabOK('mot')){const ks=runKeys().filter(x=>db.runs[x].tids.includes(o.id)).slice(-12).reverse();
  sec.push(`<section class="panel psec"><h2>Motivation pay</h2>${payDiff(o)}<div class="tw"><table><thead><tr><th class="l">Month</th><th>Gross</th><th>Deductions</th><th>Net</th><th class="l">Paid</th></tr></thead><tbody>${ks.map(x=>{const r=db.runs[x],w=wget(r,o),c=calc(r,o,w);return`<tr><td class="l">${esc(r.label)}</td><td>${fmt(c.earn)}</td><td>${fmt(c.ded)}</td><td><b>${fmt(c.net)}</b></td><td class="l">${w.paid?(w.date?dshow(w.date):'yes'):'<span class="hint">not yet</span>'}</td></tr>`}).join('')||'<tr><td class="l hint" colspan="5">No schedules yet.</td></tr>'}</tbody></table></div></section>`)}
 if(k!=='n'&&tabOK('sac')){const L=db.loans.filter(l=>k==='t'?l.tid===o.id:k==='s'?l.sid===o.id:k==='o'?l.oid===o.id:l.mid===o.id).sort(byDate).reverse(),s=k==='t'||k==='m'?savOfKey(key):null,R=db.lreq.filter(r=>r.key===key||(k==='t'&&r.tid===o.id));
  sec.push(`<section class="panel psec"><h2>SACCO</h2>${s?`<p>Trip savings <b>${fmt(s.trip)}</b> · shares value <b>${fmt(s.shares)}</b>${(()=>{const d=yeData().P.find(x=>(s.t&&x.t===s.t)||(s.m&&x.m===s.m));return d?` · dividend ${fmt(d.div)} · final payable <b>${fmt(d.pay)}</b>`:''})()}</p>`:''}
  <div class="tw"><table><thead><tr><th class="l">Loan</th><th>Principal</th><th>Interest</th><th>Repaid</th><th>Balance</th><th class="l">Last payment</th></tr></thead><tbody>${L.map(l=>`<tr><td class="l">${dshow(l.date)}</td><td>${fmt(l.principal)}</td><td>${fmt(l.interest)}</td><td>${fmt(paidOf(l))}</td><td><b class="${bal(l)>0?'badc':'ok'}">${fmt(bal(l))}</b></td><td class="l">${dshow(lastPay(l))}</td></tr>`).join('')||'<tr><td class="l hint" colspan="6">No loans.</td></tr>'}</tbody></table></div>
  ${R.length?`<p class="hint">Loan requests: ${R.map(r=>`${dshow(r.date)} KES ${fmt(r.amt)} (${esc(r.status)})`).join('; ')}</p>`:''}</section>`)}
 if((k==='t'||k==='s')&&tabOK('wel')){const W=db.wel.filter(x=>x.who===key),fromMot=k==='t'?sum(runKeys(),x=>{const r=db.runs[x];if(!r.tids.includes(o.id))return 0;return calc(r,o,wget(r,o)).vals.welfare||0}):0;
  sec.push(`<section class="panel psec"><h2>Welfare</h2><p>Contributed <b>${fmt(fromMot+sum(W.filter(x=>x.type==='in'),x=>x.amt))}</b>${fromMot?` (${fmt(fromMot)} from motivation)`:''} · benefits received <b>${fmt(sum(W.filter(x=>x.type==='out'),x=>x.amt))}</b></p>${W.length?`<table><tbody>${W.slice(-10).reverse().map(x=>`<tr><td class="l">${dshow(x.date)}</td><td class="l">${x.type==='in'?'Contribution':'Benefit'}${x.desc?' · '+esc(x.desc):''}</td><td>${fmt(x.amt)}</td></tr>`).join('')}</tbody></table>`:''}</section>`)}
 if(k==='t'&&tabOK('sat')&&db.sat.length){const rows=db.sat.map(pr=>({pr,a:sum(pr.days,d=>sum(d.lines.filter(l=>l.tid===o.id),l=>lineAmt(pr,l)))})).filter(x=>x.a);
  if(rows.length)sec.push(`<section class="panel psec"><h2>Saturday program</h2><table><tbody>${rows.map(x=>`<tr><td class="l">${esc(x.pr.name||`Term ${x.pr.t} ${x.pr.y}`)}</td><td>${fmt(x.a)}</td></tr>`).join('')}</tbody></table></section>`)}
 if(k==='n'&&tabOK('lrn')){const P=db.lpay.filter(x=>x.lid===o.id).sort(byDate).reverse(),terms=[...new Set([tkey(termOfDate()),...P.map(x=>x.term)])].sort().reverse();
  sec.push(`<section class="panel psec"><h2>Payments</h2><div class="tw"><table><thead><tr><th class="l">Term</th>${LKINDS().map(x=>`<th>${esc(x.name)}</th>`).join('')}</tr></thead><tbody>${terms.map(tk=>`<tr><td class="l">${tlabel(tk)}</td>${LKINDS().map(x=>{const f=lFee(o,x.k,tk),pd=lPaid(o,x.k,tk);return`<td>${fmt(pd)}${f?` of ${fmt(f)}${pd<f?` <span class="badc">(owes ${fmt(f-pd)})</span>`:' ✓'}`:''}</td>`}).join('')}</tr>`).join('')}</tbody></table></div>
  <table style="margin-top:8px"><tbody>${P.map(x=>`<tr><td>${esc(x.rno)}</td><td>${dshow(x.date)}</td><td class="l">${esc(lkind(x.kind).name)}, ${tlabel(x.term)}</td><td>${fmt(x.amt)}</td><td class="np"><button class="sm ghost" data-act="lprint" data-p="${x.id}">Receipt</button></td></tr>`).join('')}</tbody></table>
  <p class="hint">Parents’ portal PIN: ${o.ppin?`set ${dshow(o.ppin.at)}`:'none yet'}.</p></section>`)}
 const M=db.mlog.filter(x=>x.to===key||x.to===o.id||x.to==='n:'+o.id).slice(-10).reverse();
 if(M.length)sec.push(`<section class="panel"><h2>Messages sent</h2><table><tbody>${M.map(x=>`<tr><td class="l">${dshow(x.date)}</td><td class="l">${esc(({pay:'Payslip',stmt:'Account summary',loan:'Loan statement',free:'Own message',rem:'Reminder',sms:'SMS',rcpt:'Receipt'})[x.type]||x.type)}${x.ctx&&x.ctx!=='rem'?' · '+esc(x.ctx):''}</td><td class="l">${esc(x.by||'')}</td></tr>`).join('')}</tbody></table></section>`);
 return sec.join('')}

 ['Paying motivation each month',`<ol><li>Payments → Motivation: pick the term and month, click <b>Open or create schedule</b>.</li><li>Type the money collected; the base share is worked out for you.</li><li>Check the lines. If approval is on, the approver clicks <b>Approve this schedule</b>.</li><li><b>Print payment sheet</b> (tick the items to show) and have teachers sign.</li><li>Pay (or download the <b>bulk payment file</b> for M-Pesa or the bank), then tick each teacher as paid or click Mark all paid.</li><li>Send payslips from Records → Messages (WhatsApp or SMS).</li><li>Once signed and paid, <b>Close this month</b> so it cannot be changed.</li></ol>`],
 ['Loans',`<ol><li>SACCO → Savings and credit → <b>Issue a loan</b>. The app checks it against the SACCO rules (limit, deduction, guarantors) as you type.</li><li>Teachers can also apply from their portal; their requests appear at the top of Savings and credit. Click <b>Fill the loan form</b>, check, and Issue.</li><li>Teachers’ repayments come off motivation automatically. Others pay by M-Pesa: record them by hand or with Records → Statement matching.</li><li>Change the monthly deduction for one borrower or for particular months under the loan’s Details.</li></ol>`],

 ['M-Pesa and bank statements',`<p>Records → Statement matching: choose the statement file (Excel or CSV). The app guesses who paid and what for, and skips codes already recorded. Check the “Who” and “What it is” columns, tick, and click <b>Record the ticked rows</b>.</p>`],
 ['Reports, AGM and the health check',`<p>Records → Reports has statements, payslips, the <b>AGM pack</b> and <b>Trends</b>. Records → Health check lists problems to fix (future-dated payments, duplicates, overdue loans…). Admin → Data and access → <b>Close a year</b> at year end.</p>`],

/* ---------------- SMS ---------------- */
const smsOn=()=>!!db.set.smsOn&&!!SY.url&&!!SY.key;
const smsText=t=>String(t||'').replace(/\*/g,'').replace(/\n{3,}/g,'\n\n');
async function smsSend(list,type){const L=list.filter(x=>waNum(x.to));if(!L.length)return toast('Nobody on this list has a phone number.');
 if(!smsOn())return toast('Switch SMS on first (Admin → Settings → SMS) and set up Sync.',7000);
 const parts=sum(L,x=>Math.ceil(smsText(x.text).length/153));
 if(!confirm(`Send ${L.length} SMS (about ${parts} SMS units)? Charges apply to your SMS account.`))return;
 toast('Sending…',60000);try{const r=await call('sms',{msgs:L.map(x=>({to:x.to,text:smsText(x.text)}))}),res=r.results||[];let ok=0;
  res.forEach((x,i)=>{if(x.ok){ok++;db.mlog.push({id:uid(),n:seqn(),to:L[i].ref,type:'sms',ctx:type||'',date:today(),by:byName()})}});save();render();
  toast(`${ok} of ${L.length} SMS sent.${ok<L.length?' Not sent: '+res.map((x,i)=>x.ok?'':`${L[i].name||L[i].to} (${x.status})`).filter(Boolean).slice(0,5).join(', '):''}`,9000)}
 catch(e){toast('SMS failed: '+e.message,9000)}}
const SMSA={
 async smsrem(){await smsSend(remindList().filter(x=>x.phone).map(x=>({to:x.phone,text:x.msg,ref:x.id,name:x.who})),'rem')},
 async smslrn(){const Q=db.lrn.filter(l=>l.active!==false&&l.phone&&(!S.lg||gkey(l.grade)===S.lg)&&lFee(l,S.lk,S.ltk)-lPaid(l,S.lk,S.ltk)>0);await smsSend(Q.map(l=>({to:l.phone,text:remindText(l,S.lk,S.ltk),ref:'n:'+l.id,name:l.name})),'rem')},
 async smsrc(e){const p=db.lpay.find(x=>x.id===e.dataset.p),l=p&&lById(p.lid);if(p)await smsSend([{to:l.phone,text:rcptText(p),ref:'n:'+l.id,name:l.name}],'rcpt')},
 async smsall(){const ppl=[...db.teachers.filter(t=>S.mleft||t.active!==false).map(t=>({id:'t:'+t.id,t,name:t.name,phone:t.phone})),...(S.mt==='free'||S.mt==='loan'?db.staff.filter(s=>s.active!==false).map(s=>({id:'s:'+s.id,s,name:s.name,phone:s.phone})):[]),...(S.mt==='loan'?db.others.map(o=>({id:'o:'+o.id,o,name:o.name,phone:o.phone})):[])];
  await smsSend(ppl.map(p=>({p,m:msgFor(p)})).filter(x=>x.m).map(x=>({to:x.p.phone,text:x.m,ref:x.p.id,name:x.p.name})),S.mt)}};

 ${P.length?`<p style="font-size:.9rem">Receipts:<br>${P.slice(0,8).map(x=>`${esc(x.rno)} · ${dshow(x.date)} · KES ${fmt(x.amt)} (${esc(lkind(x.kind).name)})`).join('<br>')}</p>`:''}${db.set.payHow?`<p style="font-size:.9rem">Pay through: ${esc(db.set.payHow)}</p>`:''}`}

 <div class="row"><button data-act="mklpins">Make PINs for learners who have none</button><span class="hint">${has} of ${L.length} learners have a PIN.</span></div>

/* ---------------- loan requests and approvals ---------------- */
const approvalOn=()=>!!db.set.approve&&usersOn();
const isApprover=()=>!usersOn()||(CUR&&(CUR.role==='admin'||CUR.appr));
const runSig=r=>JSON.stringify(runRows(r).map(x=>[x.t.id,Math.round(x.c.net)]));
const runApproved=r=>!!r?.appr&&r.appr.sig===runSig(r);
function vApprove(k){const r=db.runs[k];if(!r||!approvalOn())return'';const ok=runApproved(r),changed=r.appr&&!ok;
 return`<div class="row np" style="margin:6px 0;align-items:center">${ok?`<span class="tag ok">✓ Approved by ${esc(r.appr.by)} on ${dshow(r.appr.date)}</span>`:changed?`<span class="tag bad">Changed after approval by ${esc(r.appr.by)}: needs approving again</span>`:'<span class="tag">Waiting for approval</span>'}
 ${!ok&&isApprover()?'<button class="sm" data-act="apprun">Approve this schedule</button>':''}${!ok?'<span class="hint">Teachers cannot be marked paid until an approver approves this schedule.</span>':''}</div>`}
